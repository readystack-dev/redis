# ReadyStack Redis 8.10.3 single-container CE config.
# Derived from the upstream redis.conf defaults, adapted for a containerized,
# non-root, foreground (PID 1) deployment. Protected mode is on and there is no TLS: set REDIS_PASSWORD
# for remote clients, and enable `tls-port` + certs or run behind a trusted network. (Same posture as the Prometheus/Loki CE images.)
bind * -::*
# Upstream's default: with no password set, only clients on the loopback interface (inside this container)
# may connect. Set REDIS_PASSWORD (see the entrypoint) to accept authenticated clients from other hosts.
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
# RDB snapshotting -- mount /data to persist. (AOF is off by default, matching upstream.)
dir /data
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
appendonly no
# No hard memory cap by default; the operator should set `maxmemory` per workload.
maxmemory-policy noeviction
